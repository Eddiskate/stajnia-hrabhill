<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,640&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #d9d3c6; font-family: Fraunces, Palatino, serif; }
    .sheet { width: 760px; margin: 32px auto; background: #f3eee4; padding: 48px 40px; }
    .dark { background: #1e3328; margin-top: 24px; }
    img { width: 640px; height: auto; display: block; }
    .dark img { filter: invert(1) brightness(1.15); }
    p { margin: 0 0 16px; letter-spacing: 0.14em; font-size: 13px; color: #8d4632; }
  </style>
</head>
<body>
  <div class="sheet">
    <p>NA JASNYM</p>
    <img src="logo.svg" alt="HRABHILL">
  </div>
  <div class="sheet dark">
    <p style="color:#e2b08a">NA CIEMNYM</p>
    <img src="logo.svg" alt="">
  </div>
</body>
</html>
